networks:
  resonantdust:
    external: true

services:
  start:
    image: clockworklabs/spacetime:latest
    networks:
      - resonantdust
    ports:
      - "3000:3000"
    volumes:
      - ./keys:/etc/spacetimedb
      - ./config:/home/spacetime/.config/spacetime
      - ./data:/home/spacetime/.local/share/spacetime/data
      - ../content:/workspace/server/spacetimedb/content
      - ./server:/workspace/server
      - ../pixijs:/workspace/pixijs
    working_dir: /workspace/server
    command:
      - start
      - --listen-addr=0.0.0.0:3000
      - --jwt-priv-key-path 
      - /etc/spacetimedb/id_ecdsa
      - --jwt-pub-key-path 
      - /etc/spacetimedb/id_ecdsa.pub

  build:
    image: clockworklabs/spacetime:latest
    volumes:
      - ./server:/workspace/server
      - ./data:/workspace/server/spacetimedb/data
      - ../content:/workspace/server/spacetimedb/content
      - ../pixijs:/workspace/pixijs
    working_dir: /workspace/server
    command:
      - build

  bindings:
    image: clockworklabs/spacetime:latest
    volumes:
      - ./server:/workspace/server
      - ./data:/workspace/server/spacetimedb/data
      - ../content:/workspace/server/spacetimedb/content
      - ../pixijs:/workspace/pixijs
    working_dir: /workspace/server
    entrypoint: ["/bin/bash"]
    command:
      - generate-bindings.sh

