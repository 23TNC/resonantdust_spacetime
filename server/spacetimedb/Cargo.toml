[package]
name = "resonantdust_spacetime"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib"]

[dependencies]
spacetimedb = { version = "=2.0.3" }
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Path is relative to this Cargo.toml *inside the build container*. The
# repo's `content/` is bind-mounted to `/workspace/server/spacetimedb/content`
# (see ../../compose.yml), so `path = "content"` resolves correctly during
# `bin/st build`. On the host filesystem this directory only exists as the
# bind-mount target, so cargo run directly on the host won't resolve it —
# that's intentional; all builds go through the Docker wrapper.
resonantdust-content = { path = "content" }
