[package]
name = "resonantdust_shard"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib"]

[dependencies]
spacetimedb = { version = "=2.1.0" }
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Codec only (bits/flags/packed/card_model) — narrowed off the DSL facade; the
# module needs the bit codec, not the parser/vm/loader. The legacy
# `resonantdust-content` crate is no longer linked (blueprints moved into the DSL
# Bundle, resolved gate-side).
resonantdust-codec = { path = "../../../pixijs/src/shared/codec" }
